name: Выпуск релиза

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Проверить, что версия совпадает с тегом
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$CONF" != "$TAG" ]; then
            echo "Версия в tauri.conf.json ($CONF) не совпадает с тегом $TAG"
            exit 1
          fi

      - name: Описание релиза из CHANGELOG.md
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          awk -v v="$VER" '/^## /{p=($2==v); next} p' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "Изменения не описаны." > notes.md; fi
          {
            echo "body<<NOTES_EOF"
            cat notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Установить зависимости
        run: npm install

      - name: Собрать и опубликовать релиз
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Бунт ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
