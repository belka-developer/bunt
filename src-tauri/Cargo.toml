[package]
name = "bunt"
version = "0.1.0"
description = "Бунт — единый центр сетевых инструментов"
authors = ["belka-developer"]
license = "GPL-3.0-or-later"
repository = "https://github.com/belka-developer/bunt"
edition = "2021"

[lib]
name = "bunt_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
